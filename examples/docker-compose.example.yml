# Example deployment of the sdk-proxy container image.
# Copy to docker-compose.yml, adjust the values, then run:
#   docker compose up
#
# Health endpoints (for external probes / load balancer checks):
#   GET /livez   — always 200 while the process is running
#   GET /readyz  — 200 once snapshot load completes, 503 until then
#   GET /healthz — alias for /readyz
#
# Full variable reference: docs/configuration.md

services:
  sdk-proxy:
    image: ghcr.io/dynatrace/feature-management-sdk-proxy:latest
    ports:
      - "8080:8080"
    environment:

      # ── Core ────────────────────────────────────────────────────────────────
      PORT: "8080"
      LOG_LEVEL: INFO           # DEBUG | INFO | WARN | ERROR
      SHUTDOWN_TIMEOUT: 30s     # grace period for in-flight requests on SIGTERM
      # PROXY_INSTANCE_ID: sdk-proxy-1  # unique per replica

      # ── CDN ─────────────────────────────────────────────────────────────────
      # CDN_BASE_DOMAIN: fm.dynatrace.com   # override to target a non-prod CDN environment

      # ── SSE ─────────────────────────────────────────────────────────────────
      # SSE_DISABLED: "false"   # set "true" to fall back to polling-only mode (10 s interval)
      # SSE_FANOUT_CAP_PER_KEY: "1000"      # max downstream subscribers per SDK key (0 = unlimited)
      # SSE_SUBSCRIBE_RATE_PER_SEC: "20"    # per-key subscribe rate limit
      # SSE_SUBSCRIBE_BURST: "100"          # per-key subscribe burst
      # LIFECYCLE_KEYS_CAP: "10000"         # max keys per lifecycle event

      # ── Cache / requests ────────────────────────────────────────────────────
      # CACHE_INACTIVITY_EVICT_AFTER: 48h   # evict keys idle for longer than this
      # MAX_BODY_BYTES: "10485760"          # max upstream config / metrics body size

      # ── Billing ─────────────────────────────────────────────────────────────
      # BILLING_FLUSH_INTERVAL: 60s      # how often SDK usage counters flush to billing (min 10s)
      # BILLING_RETRY_BUFFER_SIZE: "1000" # max failed samples held for retry before oldest is dropped

      # ── Snapshot persistence — local filesystem ──────────────────────────────
      # Uncomment this block and the volumes section below to persist cache
      # entries across restarts using a local directory.
      #
      # SNAPSHOT_URL: file:///snapshots   # must be an absolute path
      # SNAPSHOT_MAX_AGE: 24h             # snapshots older than this are served stale and refreshed
      # SNAPSHOT_WRITE_QUEUE_SIZE: "256"

      # ── Snapshot persistence — object storage ────────────────────────────────
      # Uncomment one SNAPSHOT_URL. Prefer IAM roles over static keys.
      #
      # SNAPSHOT_URL: s3://my-proxy-snapshots?region=us-east-1&prefix=prod/sdk-proxy
      # SNAPSHOT_URL: s3://my-proxy-snapshots?region=us-east-1&endpoint=http://minio:9000&use_path_style=true
      # SNAPSHOT_URL: gs://my-proxy-snapshots
      # SNAPSHOT_URL: azblob://my-proxy-snapshots?storage_account=myaccount
      # AWS_ACCESS_KEY_ID: ""
      # AWS_SECRET_ACCESS_KEY: ""
      # SNAPSHOT_MAX_AGE: 24h

      # ── OpenTelemetry ────────────────────────────────────────────────────────
      # Set OTEL_EXPORTER_OTLP_ENDPOINT to enable metrics and traces export.
      # The proxy uses OTLP/HTTP (port 4318) as required by Dynatrace.
      #
      # OTEL_EXPORTER_OTLP_ENDPOINT: http://otel-collector:4318
      # OTEL_SERVICE_NAME: sdk-proxy
      # OTEL_RESOURCE_ATTRIBUTES: deployment.environment=production,k8s.cluster.name=us-east-1
      # OTEL_TRACES_SAMPLER: parentbased_always_on
      # OTEL_TRACES_SAMPLER_ARG: ""   # e.g. "0.1" for 10 % sampling with traceidratio

    # Mount a volume when using a file:// SNAPSHOT_URL. New named volumes are
    # owned by root; the snapshots-init service below hands it to the image's
    # nonroot user (65532) so the proxy can write snapshots.
    # volumes:
    #   - snapshots:/snapshots
    # depends_on:
    #   snapshots-init:
    #     condition: service_completed_successfully

    restart: unless-stopped

    # Docker's default stop grace period is 10 s, shorter than SHUTDOWN_TIMEOUT.
    # Allow time for the HTTP drain, SSE close, snapshot drain, and final usage
    # flush before Docker sends SIGKILL.
    stop_grace_period: 60s

    # The image is distroless and only writes to the snapshot volume (if any).
    read_only: true
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL

  # Uncomment when using a file:// SNAPSHOT_URL.
  # snapshots-init:
  #   image: busybox:1.37
  #   command: ["chown", "65532:65532", "/snapshots"]
  #   volumes:
  #     - snapshots:/snapshots

# Uncomment when using a file:// SNAPSHOT_URL.
# volumes:
#   snapshots:
