# Example Kubernetes deployment of the sdk-proxy container image.
#
# For most deployments prefer the Helm chart in charts/feature-management-sdk-proxy, which renders
# an equivalent (and validated) set of resources:
#   helm install sdk-proxy ./charts/feature-management-sdk-proxy
#
# This file is a single multi-document manifest. Apply it with:
#   kubectl apply -f kubernetes.example.yml
#
# Sections marked "optional" are commented out. Uncomment the blocks
# that match your deployment requirements.
#
# Health endpoints (wired to the probes below):
#   GET /livez   — always 200 while the process is running
#   GET /readyz  — 200 once snapshot load completes, 503 until then
#   GET /healthz — alias for /readyz
#
# Full variable reference: docs/configuration.md

---
# ── ConfigMap — non-sensitive configuration ────────────────────────────────────
apiVersion: v1
kind: ConfigMap
metadata:
  name: sdk-proxy-config
  # namespace: sdk-proxy
data:
  # Core
  PORT: "8080"
  LOG_LEVEL: INFO           # DEBUG | INFO | WARN | ERROR
  SHUTDOWN_TIMEOUT: 30s     # grace period for in-flight requests on SIGTERM

  # CDN
  # CDN_BASE_DOMAIN: fm.dynatrace.com   # override to target a non-prod CDN environment

  # SSE
  # SSE_DISABLED: "false"   # set "true" to fall back to polling-only mode (10 s interval)
  # SSE_FANOUT_CAP_PER_KEY: "1000"      # max downstream subscribers per SDK key (0 = unlimited)
  # SSE_SUBSCRIBE_RATE_PER_SEC: "20"    # per-key subscribe rate limit
  # SSE_SUBSCRIBE_BURST: "100"          # per-key subscribe burst
  # LIFECYCLE_KEYS_CAP: "10000"         # max keys per lifecycle event

  # Cache / requests
  # CACHE_INACTIVITY_EVICT_AFTER: 48h   # evict keys idle for longer than this
  # MAX_BODY_BYTES: "10485760"          # max upstream config / metrics body size

  # Billing
  # BILLING_FLUSH_INTERVAL: 60s
  # BILLING_RETRY_BUFFER_SIZE: "1000"

  # Snapshot persistence — set exactly one SNAPSHOT_URL
  # SNAPSHOT_URL: file:///snapshots   # must match the volume mount path below
  # SNAPSHOT_URL: s3://my-proxy-snapshots?region=us-east-1&prefix=prod/sdk-proxy
  # SNAPSHOT_URL: s3://my-proxy-snapshots?region=us-east-1&endpoint=http://minio:9000&use_path_style=true
  # SNAPSHOT_URL: gs://my-proxy-snapshots?prefix=prod/sdk-proxy
  # SNAPSHOT_URL: azblob://my-proxy-snapshots?storage_account=myaccount&prefix=prod/sdk-proxy
  # SNAPSHOT_MAX_AGE: 24h
  # SNAPSHOT_WRITE_QUEUE_SIZE: "256"

  # OpenTelemetry — set the endpoint to enable metrics and traces export
  # OTEL_EXPORTER_OTLP_ENDPOINT: http://otel-collector.monitoring:4318
  # OTEL_SERVICE_NAME: sdk-proxy
  # OTEL_RESOURCE_ATTRIBUTES: deployment.environment=production,k8s.cluster.name=us-east-1
  # OTEL_TRACES_SAMPLER: parentbased_always_on
  # OTEL_TRACES_SAMPLER_ARG: ""   # e.g. "0.1" for 10 % sampling with traceidratio

---
# ── Secret — storage credentials (optional) ───────────────────────────────────
# Only needed for static credentials (provider env vars). Omit with IRSA or
# Workload Identity.
#
# apiVersion: v1
# kind: Secret
# metadata:
#   name: sdk-proxy-storage-credentials
#   # namespace: sdk-proxy
# stringData:
#   AWS_ACCESS_KEY_ID: AKIAIOSFODNN7EXAMPLE
#   AWS_SECRET_ACCESS_KEY: wJalrXUtnFEMI/K7MDENG/bPxRfiCYEXAMPLEKEY

---
# ── Deployment ─────────────────────────────────────────────────────────────────
apiVersion: apps/v1
kind: Deployment
metadata:
  name: sdk-proxy
  # namespace: sdk-proxy
  labels:
    app: sdk-proxy
spec:
  replicas: 2
  selector:
    matchLabels:
      app: sdk-proxy
  template:
    metadata:
      labels:
        app: sdk-proxy
    spec:
      # Must exceed SHUTDOWN_TIMEOUT + SSE close (5 s) + snapshot drain + usage flush (10 s).
      terminationGracePeriodSeconds: 60
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532     # distroless "nonroot"
        runAsGroup: 65532
        fsGroup: 65532       # lets the proxy write to a mounted snapshot volume
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: sdk-proxy
          image: ghcr.io/dynatrace/feature-management-sdk-proxy:latest  # pin a release tag (e.g. v0.2.0) in production
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          ports:
            - name: http
              containerPort: 8080
              protocol: TCP

          envFrom:
            - configMapRef:
                name: sdk-proxy-config
            # Uncomment when using static storage credentials:
            # - secretRef:
            #     name: sdk-proxy-storage-credentials

          env:
            # PROXY_INSTANCE_ID is set per-pod via the Downward API so that
            # billing records can distinguish replicas in a fleet.
            - name: PROXY_INSTANCE_ID
              valueFrom:
                fieldRef:
                  fieldPath: metadata.name

          # httpGet probes work against distroless images — no shell required.
          startupProbe:
            httpGet:
              path: /readyz
              port: http
            failureThreshold: 12   # 12 × 5 s = 60 s for slow snapshot loads
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /livez
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /readyz
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
            failureThreshold: 3

          resources:
            requests:
              cpu: 100m
              memory: 64Mi
            limits:
              cpu: 500m
              memory: 256Mi

          # Uncomment when using a file:// SNAPSHOT_URL:
          # volumeMounts:
          #   - name: snapshots
          #     mountPath: /snapshots

      # Uncomment when using a file:// SNAPSHOT_URL:
      # volumes:
      #   - name: snapshots
      #     persistentVolumeClaim:
      #       claimName: sdk-proxy-snapshots

---
# ── Service ────────────────────────────────────────────────────────────────────
apiVersion: v1
kind: Service
metadata:
  name: sdk-proxy
  # namespace: sdk-proxy
spec:
  selector:
    app: sdk-proxy
  # With multiple replicas, an SDK's /sse subscription may land on a pod that
  # has not cached its config yet (412, SDK retries). ClientIP affinity avoids it.
  # sessionAffinity: ClientIP
  ports:
    - name: http
      port: 8080   # SDKs use configOrigin: http://sdk-proxy:8080
      targetPort: http
      protocol: TCP
  type: ClusterIP

---
# ── PersistentVolumeClaim — local snapshot storage (optional) ──────────────────
# Uncomment when using a file:// SNAPSHOT_URL and reference it in the Deployment
# volumes block above.
#
# apiVersion: v1
# kind: PersistentVolumeClaim
# metadata:
#   name: sdk-proxy-snapshots
#   # namespace: sdk-proxy
# spec:
#   accessModes:
#     - ReadWriteOnce
#   resources:
#     requests:
#       storage: 1Gi

---
# ── HorizontalPodAutoscaler (optional) ────────────────────────────────────────
# Requires the Kubernetes metrics-server. Note: local snapshot persistence
# (ReadWriteOnce PVCs) is incompatible with HPA scaling to multiple nodes —
# use a shared bucket or no persistence when enabling autoscaling.
#
# apiVersion: autoscaling/v2
# kind: HorizontalPodAutoscaler
# metadata:
#   name: sdk-proxy
#   # namespace: sdk-proxy
# spec:
#   scaleTargetRef:
#     apiVersion: apps/v1
#     kind: Deployment
#     name: sdk-proxy
#   minReplicas: 2
#   maxReplicas: 10
#   metrics:
#     - type: Resource
#       resource:
#         name: cpu
#         target:
#           type: Utilization
#           averageUtilization: 70

---
# ── PodDisruptionBudget (optional) ─────────────────────────────────────────────
# Keeps at least one replica serving during node drains.
#
# apiVersion: policy/v1
# kind: PodDisruptionBudget
# metadata:
#   name: sdk-proxy
#   # namespace: sdk-proxy
# spec:
#   maxUnavailable: 1
#   selector:
#     matchLabels:
#       app: sdk-proxy
