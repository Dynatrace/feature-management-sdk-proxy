suite: test-connection
templates:
  - tests/test-connection.yaml
tests:
  - it: isn't selected by the proxy's selectors
    asserts:
      # selected pods get the proxy's NetworkPolicy egress rules and can't reach the Service
      - notExists:
          path: metadata.labels["app.kubernetes.io/name"]
      - equal:
          path: metadata.labels["app.kubernetes.io/component"]
          value: test

  - it: renders nothing when tests are disabled
    set:
      tests.enabled: false
    asserts:
      - hasDocuments:
          count: 0

  - it: uses the configured test image and resources
    set:
      tests.enabled: true
      tests.image.registry: mirror.example.com
      tests.image.repository: library/busybox
      tests.image.tag: "1.38"
      tests.resources.limits.memory: 16Mi
    asserts:
      - equal:
          path: spec.containers[0].image
          value: mirror.example.com/library/busybox:1.38
      - equal:
          path: spec.containers[0].resources.limits.memory
          value: 16Mi

  - it: uses the chart's image pull secrets
    set:
      imagePullSecrets:
        - name: regcred
    asserts:
      - equal:
          path: spec.imagePullSecrets[0].name
          value: regcred

  - it: templates commonLabels
    set:
      global.cluster: dev1
      commonLabels.cluster: "{{ .Values.global.cluster }}"
    asserts:
      - equal:
          path: metadata.labels.cluster
          value: dev1
