suite: values schema
templates:
  - configmap.yaml
tests:
  - it: rejects unknown top-level keys
    set:
      replicas: 3
    asserts:
      - failedTemplate: {}

  - it: rejects invalid log levels
    set:
      logLevel: TRACE
    asserts:
      - failedTemplate: {}

  - it: rejects malformed digests
    set:
      image.digest: latest
    asserts:
      - failedTemplate: {}

  - it: rejects non-duration shutdown timeouts
    set:
      shutdownTimeout: "30"
    asserts:
      - failedTemplate: {}

  - it: rejects unsupported snapshot URL schemes
    set:
      snapshot.url: gcs://bucket
    asserts:
      - failedTemplate: {}

  - it: rejects removed snapshot.s3 settings
    set:
      snapshot.s3.bucket: b
    asserts:
      - failedTemplate: {}

  - it: rejects invalid credential env var names
    set:
      snapshot.credentials.env:
        "not-an-env-var": x
    asserts:
      - failedTemplate: {}

  - it: accepts a templated snapshot URL
    set:
      snapshot.url: "{{ .Values.global.bucket }}"
    asserts:
      - notFailedTemplate: {}

  - it: rejects unknown test settings
    set:
      tests.image.digest: sha256:0
    asserts:
      - failedTemplate: {}

  - it: accepts a templated replicaCount
    set:
      replicaCount: "{{ 3 }}"
    asserts:
      - notFailedTemplate: {}
