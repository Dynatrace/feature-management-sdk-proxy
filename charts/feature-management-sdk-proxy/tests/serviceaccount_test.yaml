suite: serviceaccount
templates:
  - serviceaccount.yaml
tests:
  - it: carries workload identity annotations
    set:
      serviceAccount.annotations:
        eks.amazonaws.com/role-arn: arn:aws:iam::123456789012:role/snapshots
    asserts:
      - equal:
          path: metadata.annotations["eks.amazonaws.com/role-arn"]
          value: arn:aws:iam::123456789012:role/snapshots
      - equal:
          path: automountServiceAccountToken
          value: false

  - it: can be disabled
    set:
      serviceAccount.create: false
    asserts:
      - hasDocuments:
          count: 0
