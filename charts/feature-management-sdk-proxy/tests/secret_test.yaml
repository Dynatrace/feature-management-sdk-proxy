suite: secret
templates:
  - secret.yaml
tests:
  - it: is not rendered by default
    asserts:
      - hasDocuments:
          count: 0

  - it: is not rendered for existingSecret
    set:
      snapshot:
        enabled: true
        url: s3://b?region=r
        credentials: {existingSecret: x}
    asserts:
      - hasDocuments:
          count: 0

  - it: stores static credential env vars under their native names
    set:
      snapshot:
        enabled: true
        url: s3://b?region=r
        credentials:
          env:
            AWS_ACCESS_KEY_ID: AKIA
            AWS_SECRET_ACCESS_KEY: shh
    asserts:
      - hasDocuments:
          count: 1
      - equal:
          path: data.AWS_ACCESS_KEY_ID
          value: QUtJQQ==
      - equal:
          path: data.AWS_SECRET_ACCESS_KEY
          value: c2ho
