suite: secret
templates:
  - secret.yaml
tests:
  - it: is not rendered by default
    asserts:
      - hasDocuments:
          count: 0

  - it: is not rendered for existingSecret
    set:
      snapshot:
        enabled: true
        s3: {bucket: b, region: r}
        credentials: {existingSecret: x}
    asserts:
      - hasDocuments:
          count: 0

  - it: stores static keys
    set:
      snapshot:
        enabled: true
        s3: {bucket: b, region: r}
        credentials: {accessKey: AKIA, secretKey: shh}
    asserts:
      - hasDocuments:
          count: 1
      - equal:
          path: data.accessKey
          value: QUtJQQ==
      - equal:
          path: data.secretKey
          value: c2ho
