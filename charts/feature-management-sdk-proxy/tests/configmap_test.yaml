suite: configmap
templates:
  - configmap.yaml
tests:
  - it: renders defaults
    asserts:
      - equal:
          path: data
          value:
            PORT: "8080"
            LOG_LEVEL: INFO
            SHUTDOWN_TIMEOUT: 30s

  - it: maps typed values to env vars
    set:
      logLevel: DEBUG
      cdnBaseDomain: fm.dynatracelabs.com
      sse:
        enabled: false
        fanoutCapPerKey: 0
        subscribeRatePerSec: 5
        subscribeBurst: 10
      otel:
        endpoint: http://otel:4318
        tracesSamplerArg: "0.1"
    asserts:
      - equal:
          path: data.LOG_LEVEL
          value: DEBUG
      - equal:
          path: data.CDN_BASE_DOMAIN
          value: fm.dynatracelabs.com
      - equal:
          path: data.SSE_DISABLED
          value: "true"
      - equal:
          path: data.SSE_FANOUT_CAP_PER_KEY
          value: "0"
      - equal:
          path: data.SSE_SUBSCRIBE_RATE_PER_SEC
          value: "5"
      - equal:
          path: data.SSE_SUBSCRIBE_BURST
          value: "10"
      - equal:
          path: data.OTEL_EXPORTER_OTLP_ENDPOINT
          value: http://otel:4318
      - equal:
          path: data.OTEL_TRACES_SAMPLER_ARG
          value: "0.1"

  - it: configures snapshots
    set:
      snapshot:
        enabled: true
        maxAge: 12h
        url: s3://snaps?region=eu-west-1&endpoint=http://minio:9000&use_path_style=true&prefix=prod
    asserts:
      - equal:
          path: data.SNAPSHOT_URL
          value: s3://snaps?region=eu-west-1&endpoint=http://minio:9000&use_path_style=true&prefix=prod
      - equal:
          path: data.SNAPSHOT_MAX_AGE
          value: 12h
      - notExists:
          path: data.SNAPSHOT_BACKEND

  - it: templates the snapshot URL
    set:
      global.bucket: snaps
      snapshot.enabled: true
      snapshot.url: "gs://{{ .Values.global.bucket }}?prefix=proxy/"
    asserts:
      - equal:
          path: data.SNAPSHOT_URL
          value: gs://snaps?prefix=proxy/

  - it: fails when the snapshot URL template renders empty
    set:
      global.bucket: ""
      snapshot.enabled: true
      snapshot.url: "{{ .Values.global.bucket }}"
    asserts:
      - failedTemplate:
          errorMessage: snapshot.url is required when snapshot.enabled=true

  - it: fails when the snapshot URL template renders an unsupported scheme
    set:
      global.bucket: snaps
      snapshot.enabled: true
      snapshot.url: "gcs://{{ .Values.global.bucket }}"
    asserts:
      - failedTemplate:
          errorPattern: must start with s3://

  - it: omits snapshot settings when disabled
    set:
      snapshot.url: gs://ignored
    asserts:
      - notExists:
          path: data.SNAPSHOT_URL

  - it: requires a URL
    set:
      snapshot.enabled: true
    asserts:
      - failedTemplate:
          errorMessage: snapshot.url is required when snapshot.enabled=true

  - it: rejects existingSecret combined with static env
    set:
      snapshot:
        enabled: true
        url: s3://b?region=r
        credentials:
          existingSecret: x
          env: {AWS_ACCESS_KEY_ID: a}
    asserts:
      - failedTemplate:
          errorMessage: set either snapshot.credentials.existingSecret or snapshot.credentials.env, not both

  - it: templates otel settings
    set:
      global.cluster: dev1
      otel.endpoint: "http://otel.{{ .Values.global.cluster }}:4318"
      otel.resourceAttributes: "k8s.cluster.name={{ .Values.global.cluster }}"
    asserts:
      - equal:
          path: data.OTEL_EXPORTER_OTLP_ENDPOINT
          value: http://otel.dev1:4318
      - equal:
          path: data.OTEL_RESOURCE_ATTRIBUTES
          value: k8s.cluster.name=dev1
