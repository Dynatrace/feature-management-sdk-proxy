suite: networkpolicy
templates:
  - networkpolicy.yaml
tests:
  - it: is not rendered by default
    asserts:
      - hasDocuments:
          count: 0

  - it: allows DNS and HTTPS egress except cloud metadata
    set:
      networkPolicy.enabled: true
    asserts:
      - contains:
          path: spec.egress
          content:
            ports:
              - port: 53
                protocol: UDP
              - port: 53
                protocol: TCP
      - equal:
          path: spec.egress[1].ports[0].port
          value: 443
      - contains:
          path: spec.egress[1].to
          content:
            ipBlock:
              cidr: 0.0.0.0/0
              except:
                - 169.254.169.254/32
      - contains:
          path: spec.egress[1].to
          content:
            ipBlock:
              cidr: ::/0
              except:
                - fd00:ec2::254/128

  - it: appends extraEgress
    set:
      networkPolicy.enabled: true
      networkPolicy.extraEgress:
        - to:
            - ipBlock:
                cidr: 169.254.169.252/32
          ports:
            - port: 988
              protocol: TCP
    asserts:
      - equal:
          path: spec.egress[2].ports[0].port
          value: 988

  - it: restricts ingress to configured peers
    set:
      networkPolicy.enabled: true
      networkPolicy.ingress.from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: apps
    asserts:
      - equal:
          path: spec.ingress[0].from[0].namespaceSelector.matchLabels["kubernetes.io/metadata.name"]
          value: apps
      - equal:
          path: spec.ingress[0].ports[0].port
          value: http

  - it: allows any source when no peers are configured
    set:
      networkPolicy.enabled: true
    asserts:
      - notExists:
          path: spec.ingress[0].from
