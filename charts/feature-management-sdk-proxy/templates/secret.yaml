{{- with .Values.snapshot }}
{{- if and .enabled (not .credentials.existingSecret) .credentials.accessKey }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "fmsp.credentialsSecretName" $ }}
  labels:
    {{- include "fmsp.labels" $ | nindent 4 }}
type: Opaque
data:
  accessKey: {{ .credentials.accessKey | b64enc | quote }}
  secretKey: {{ .credentials.secretKey | b64enc | quote }}
{{- end }}
{{- end }}
