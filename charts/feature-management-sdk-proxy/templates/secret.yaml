{{- with .Values.snapshot }}
{{- if and .enabled (not .credentials.existingSecret) .credentials.env }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "fmsp.credentialsSecretName" $ }}
  labels:
    {{- include "fmsp.labels" $ | nindent 4 }}
type: Opaque
data:
  {{- range $name, $value := .credentials.env }}
  {{ $name }}: {{ $value | toString | b64enc | quote }}
  {{- end }}
{{- end }}
{{- end }}
