{{- if and (eq .Values.snapshot.backend "s3") (not .Values.snapshot.s3.existingSecret) .Values.snapshot.s3.accessKey }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "sdk-proxy.s3SecretName" . }}
  labels:
    {{- include "sdk-proxy.labels" . | nindent 4 }}
type: Opaque
data:
  accessKey: {{ .Values.snapshot.s3.accessKey | b64enc | quote }}
  secretKey: {{ .Values.snapshot.s3.secretKey | b64enc | quote }}
{{- end }}
